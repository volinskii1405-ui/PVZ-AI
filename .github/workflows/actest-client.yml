name: Build actest-client

on:
  push:
    paths:
      - 'minecraft-actest-client/**'
      - '.github/workflows/actest-client.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-actest-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: actest-client
          path: minecraft-actest-client/build/libs/*.jar
          if-no-files-found: error
